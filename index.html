<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azura</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a18}iframe{border:0;width:100%;height:100%}
#syncBtn{position:fixed;left:12px;bottom:12px;z-index:999999;padding:9px 12px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:#0d1a33;color:#fff;font:700 12px system-ui;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}
</style>
</head>
<body>
<iframe id="app" src="app.html"></iframe>
<button id="syncBtn" type="button">OTMAHER Senkron</button>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d||d.querySelector('script[data-otmaher-sync]')) return;
  const s=d.createElement('script');
  s.src='otmaher-sync.js';
  s.dataset.otmaherSync='1';
  d.body.appendChild(s);
});
document.getElementById('syncBtn').addEventListener('click',()=>{
  const w=frame.contentWindow;
  const current=w.OTMAHER_SYNC?.getUrl?.()||'';
  const url=prompt('Apps Script /exec adresini gir:',current.split('?')[0]||'');
  if(!url) return;
  const oldKey=(current.match(/[?&]key=([^&]+)/)||[])[1]||'';
  const key=prompt('AZURA_SYNC_KEY değerini gir:',oldKey?decodeURIComponent(oldKey):'');
  if(!key) return;
  const sep=url.includes('?')?'&':'?';
  const full=url+sep+'key='+encodeURIComponent(key);
  if(w.OTMAHER_SYNC?.setUrl){ w.OTMAHER_SYNC.setUrl(full); }
  else alert('Senkron modülü henüz yüklenmedi. Birkaç saniye sonra tekrar dene.');
});
</script>
</body>
</html>
